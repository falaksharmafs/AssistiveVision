name: assistive_vision
description: "DRDO Assistive Vision System"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  http: ^1.2.1

  cupertino_icons: ^1.0.8

  camera: ^0.10.5+9

  # TensorFlow Lite
  tflite_flutter: ^0.12.1

  image_picker: ^1.2.0

  # Image processing
  image: ^4.5.4

  # Text-to-Speech
  flutter_tts: ^4.0.2

  # Permissions
  permission_handler: ^11.3.1

  # Bluetooth communication

  # Utility collections
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/models/yolov8n_float32.tflite
    - assets/models/coco_labels.txt
